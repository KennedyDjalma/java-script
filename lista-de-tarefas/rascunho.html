<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.materialdesignicons.com/7.2.96/css/materialdesignicons.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_box" />

</head>

<body>
    <h1>Lista de Tarefas</h1>

    <header>
        <input id="inputTarefa" type="text" placeholder="Digite Sua Tarefa">
        <button onclick="addTarefa()" id="btn-add" class="add">Adicionar <br>
            <span class="material-symbols-outlined">add_box</span>
        </button>
    </header>

    <main id="areaLista">
        
        <div class="item">
            <div class="item-icone">
                <i class="mdi mdi-radiobox-blank"></i>
            </div> <!--.item-icone -->

            <div class="item-nome">
                Teste de Tarefa
            </div> <!--.item-nome -->

            <div class="item-botao">
                <button class="delete"> Deletar <br>
                    <i class="mdi mdi-trash-can-outline"></i>
                </button>
            </div> <!--.item-botao -->
        </div> 
        <!-- item -->


        <div class="item-clicado">
            <div class="item-icone">
                <i id="icone-marcado" class="mdi mdi-radiobox-marked"></i>
            </div> <!--.item-icone -->

            <div class="item-nome">
                Teste de Tarefa
            </div> <!--.item-nome -->

            <div class="item-botao">
                <button class="delete">Deletar <br>
                    <i class="mdi mdi-trash-can-outline"></i>
                </button>
            </div> <!--.item-botao -->
        </div> <!-- item -->


    </main>

    <!-- <script src="js/script.js"></script> -->
</body>

</html>
